<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xenon</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="xenon-app">

    <header class="top-hud">
      <div class="hud-time">
        <span id="time">--:--:--</span>
        <small id="date">----</small>
      </div>
      <div class="hud-status">
        XENON // <span id="top-system-status">OFFLINE</span>
      </div>
    </header>

    <section class="side-panel left-panel">
      <h2>SYSTEM</h2>
      <div class="system-row"><span>CORE</span><strong>ONLINE</strong></div>
      <div class="system-row"><span>MEMORY</span><strong>READY</strong></div>
      <div class="system-row"><span>NETWORK</span><strong>ONLINE</strong></div>
    </section>

    <section class="xenon-center">
      <div class="xenon-core">
        <div class="core-ring ring-1"></div>
        <div class="core-ring ring-2"></div>
        <div class="core-ring ring-3"></div>
        <div class="core-center"><span>X</span></div>
      </div>

      <h1>XENON</h1>
      <p id="status-text">SYSTEM INITIALIZING...</p>
    </section>

    <section class="side-panel right-panel">
      <h2>TASKS</h2>
      <div class="task-number">00</div>
      <p>ACTIVE TASKS</p>
    </section>

    <section class="xenon-console" id="xenon-console">
      <div class="console-line system">
        <span class="console-label">SYSTEM</span>
        <span class="console-text">Waiting for Xenon startup...</span>
      </div>
    </section>

    <div class="command-bar">
      <span class="command-prefix">&gt;</span>
      <input id="command-input" type="text" placeholder="Ask Xenon..." autocomplete="off">
      <button id="command-send" type="button">SEND</button>
    </div>

  </main>

  <script src="config.js"></script>
  <script src="xenon-core.js"></script>
  <script src="xenon-state.js"></script>
  <script src="xenon-ui.js"></script>
  <script src="xenon-memory.js"></script>
  <script src="xenon-notes.js"></script>
  <script src="xenon-tasks.js"></script>
  <script src="xenon-reminders.js"></script>
  <script src="xenon-tools.js"></script>
  <script src="xenon-brain.js"></script>
  <script src="xenon-agent.js"></script>
  <script src="xenon-voice.js"></script>
  <script src="app.js"></script>
</body>
</html>
